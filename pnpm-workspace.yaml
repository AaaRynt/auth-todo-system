  '@typescript/typescript6>@typescript/old': 'npm:typescript@6.0.2'

allowBuilds:
  '@prisma/engines': true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
